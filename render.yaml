services:
  - type: web
    name: bnakowa-modern-guest-house
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --global pnpm@10.15.1 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BNAKOWA_ADMIN_USERNAME
        value: admin
      - key: BNAKOWA_ADMIN_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: 10
